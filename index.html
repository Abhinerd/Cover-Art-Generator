<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Audio Cover Art Generator</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <button id="themeToggle" title="Toggle Theme" aria-label="Toggle theme">
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
      <path fill="none" d="M0 0h24v24H0z" />
      <path
        d="M10 7a7 7 0 0 0 12 4.9v.1c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2h.1A6.977 6.977 0 0 0 10 7zm-6 5a8 8 0 0 0 15.062 3.762A9 9 0 0 1 8.238 4.938 7.999 7.999 0 0 0 4 12z" />
    </svg>
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
      <path fill="none" d="M0 0h24v24H0z" />
      <path
        d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z" />
    </svg>
  </button>

  <h1>Audio Cover Art Generator</h1>

  <div class="file-upload-container">
    <label for="audioUpload" class="file-upload-label">
      <span>Choose an audio file</span>
      <small>WAV, MP3, OGG, or OPUS</small>
    </label>
    <input type="file" id="audioUpload" accept=".wav,.mp3,.ogg,.opus" />
  </div>

  <div class="input-group">
    <label for="albumName">Album Name (optional)</label>
    <input type="text" id="albumName" placeholder="Enter album name" />
  </div>

  <div class="input-group">
    <label for="colorMode">Color Mode</label>
    <select id="colorMode">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="button-group">
    <button id="generateBtn">Generate Cover Art</button>
  </div>

  <div id="status">
    <div id="status-progress"></div>
  </div>
  <canvas id="canvas" width="2000" height="2000"></canvas>
  <a id="downloadBtn" style="display:none;" download="cover.png">Download Cover</a>

  <script src="js/main.js"></script>
</body>

</html>
